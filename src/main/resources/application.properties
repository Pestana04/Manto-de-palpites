spring.application.name=manto-de-palpites
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/manto;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
server.error.include-message=never
server.tomcat.max-http-form-post-size=2MB
spring.servlet.multipart.max-file-size=1MB
spring.jackson.deserialization.fail-on-unknown-properties=true
football.api-key=${FOOTBALL_API_KEY:}
football.team-id=${FLAMENGO_TEAM_ID:127}
football.sync-enabled=${FOOTBALL_SYNC_ENABLED:true}
football.sync-cron=${FOOTBALL_SYNC_CRON:0 0 5 * * *}
